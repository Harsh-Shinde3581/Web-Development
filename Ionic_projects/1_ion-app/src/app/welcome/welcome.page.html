<ion-content>
<ion-item><!-- paste into your page's HTML -->
<div class="logo-wrap" role="img" aria-label="App logo">
  <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#20C997"/>
        <stop offset="1" stop-color="#17A2B8"/>
      </linearGradient>
    </defs>

    <g class="rotor">
      <circle cx="100" cy="100" r="64" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round"/>
    </g>

    <g class="pulse">
      <polygon points="100,62 125,125 75,125" fill="url(#g1)" transform-origin="100 100"/>
    </g>

    <circle class="orbit-dot" cx="100" cy="28" r="6" fill="#ffffff" opacity="0.95"/>
  </svg>
</div></ion-item>
</ion-content>
