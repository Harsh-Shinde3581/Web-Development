<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists Document</title>
</head>
<body>
    <!-- unordered data ul i.e unordered list -->
     <h1>Students List</h1><br>
     <h4>unordered list</h4>

     <!-- type attribute -->
     <!-- bullet types like square,circle,disc -->
     <ul  type="square">
      <li>Abhi</li>  
      <li>Parth</li>  
      <li>Sai</li>  
     </ul>

     <h4>ordered list</h4>
     <!-- type attribute  -->
     <!-- types like 1,I,i,a,A  -->
    
     <ol type="A">
      <li>Abhi</li>  
      <li>Parth</li>  
      <li>Sai</li>  
     </ol>
</body>
</html>
