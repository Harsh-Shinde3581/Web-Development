<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Displaying audios,videos and posters</title>
</head>
<body>
   <video 
  src="video.mp4" 
  height="400" 
  width="800"
  controls 
  loop 
  muted 
  poster="sc-code_img.png">
</video>

<audio 
  src="Song1.mp3" 
  controls>
</audio>
<iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=G7Auvjy-vBGawPei" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen ></iframe>
<svg width="100" height="100">
    <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red"/>
</svg>
<img src="image.svg" alt="My Svg image">
</body>
</html>
