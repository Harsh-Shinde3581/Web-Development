<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
     <link rel="stylesheet" href="table.css">
   
</head>
<body>
    <table >
         <!-- here <thead></thead> is a defined header in table which helpful in css -->
        <thead><caption>Student Details</caption></thead>
         <!-- here <tbody></tbody> is a defined body in table which helpful in css -->
        <tbody>
         <!-- here <tr></tr> is row in the table  -->
        <tr>
         <!-- here <th></th> is table header cell -->
            <th>Name</th>
            <th>Designation</th>
            <th>Fav Lang</th>
        </tr>
        <tr>
         <!-- here <td></td> is table data in the table  -->
            <td>Harsh</td>
            <td>Programmer</td>
            <td>Python</td>
        </tr>

        </tbody>
         <!-- here <tfoot></tfoot> is a defined footer in table which helpful in css -->
        <tfoot>
            <tr>
            <td colspan="2">Pranav</td>
            <td rowspan="2">Java</td>
        </tr>
        <tr>
            <td colspan="2">Viraj</td>
        </tr>
        </tfoot>
    </table>

</body>

</html>
