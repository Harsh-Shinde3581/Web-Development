<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS to html</title>
    <style>
        span{
            color: aqua;
            background: rgb(135, 91, 4);
        }
    </style>
</head>
<body>
    <h1 style="color: red; background: yellow;">Three ways toadd css to html</h1>
    <span>Third one is good</span>
    <div>
        <ol>
            <li>Inline CSS</li>
            <!-- to add style to every element like h1 -->
            <li>Internal CSS</li>
            <!-- to add a style block after title like span  -->
            <li>External CSS</li>
            <!-- to link a CSS file externally  -->
        </ol>
    </div>
</body>
</html>
